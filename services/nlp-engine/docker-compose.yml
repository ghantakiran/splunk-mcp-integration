version: '3.8'

services:
  nlp-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splunk-mcp-nlp-engine
    ports:
      - "8001:8001"
      - "9090:9090"  # Metrics port
    environment:
      - APP_NAME=splunk-mcp-nlp-engine
      - APP_VERSION=1.0.0
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8001
      
      # AI/ML Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4-turbo-preview
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=claude-3-sonnet-20240229
      - DEFAULT_AI_PROVIDER=openai
      
      # Database Configuration
      - DATABASE_URL=postgresql+asyncpg://nlp_user:nlp_password@postgres:5432/splunk_mcp_nlp
      
      # Redis Configuration
      - REDIS_URL=redis://redis:6379/2
      
      # Security Configuration
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret}
      
      # Monitoring
      - ENABLE_METRICS=true
      - STRUCTURED_LOGGING=true
      - LOG_JSON_FORMAT=false  # Disable for development
      
      # CORS Configuration
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8000","http://localhost:8001"]
    
    volumes:
      - ./:/app
      - nlp_logs:/app/logs
    
    depends_on:
      - postgres
      - redis
    
    networks:
      - nlp-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: nlp-postgres
    environment:
      - POSTGRES_DB=splunk_mcp_nlp
      - POSTGRES_USER=nlp_user
      - POSTGRES_PASSWORD=nlp_password
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    
    volumes:
      - nlp_postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    
    ports:
      - "5432:5432"
    
    networks:
      - nlp-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlp_user -d splunk_mcp_nlp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nlp-redis
    command: redis-server --appendonly yes --requirepass redis_password
    
    volumes:
      - nlp_redis_data:/data
    
    ports:
      - "6379:6379"
    
    networks:
      - nlp-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: nlp-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - nlp_prometheus_data:/prometheus
    
    ports:
      - "9091:9090"
    
    networks:
      - nlp-network
    
    restart: unless-stopped
    
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: nlp-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    
    volumes:
      - nlp_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    
    ports:
      - "3000:3000"
    
    networks:
      - nlp-network
    
    restart: unless-stopped
    
    profiles:
      - monitoring

volumes:
  nlp_postgres_data:
    driver: local
  nlp_redis_data:
    driver: local
  nlp_logs:
    driver: local
  nlp_prometheus_data:
    driver: local
  nlp_grafana_data:
    driver: local

networks:
  nlp-network:
    driver: bridge