version: '3.8'

services:
  pdf-export-service:
    build:
      context: .
      target: development
    container_name: pdf-export-service
    ports:
      - "8009:8009"  # API port
      - "9009:9009"  # Metrics port
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://pdfservice:pdfservice@postgres:5432/pdfservice
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=your-secret-key-here
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000,http://localhost:8009
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - PDF_OUTPUT_DIR=/app/output
      - PDF_TEMPLATE_DIR=/app/templates
      - CHART_SERVICE_URL=http://visualization:8002
    depends_on:
      - postgres
      - redis
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./templates:/app/templates
      - ./output:/app/output
      - ./temp:/app/temp
    networks:
      - pdf-network
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: pdf-postgres
    environment:
      - POSTGRES_DB=pdfservice
      - POSTGRES_USER=pdfservice
      - POSTGRES_PASSWORD=pdfservice
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - pdf-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pdf-redis
    ports:
      - "6383:6379"
    volumes:
      - redis_data:/data
    networks:
      - pdf-network
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: pdf-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8084:8081"
    depends_on:
      - redis
    networks:
      - pdf-network
    restart: unless-stopped

  # Optional: PostgreSQL Admin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pdf-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - pdf-network
    restart: unless-stopped

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: pdf-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - pdf-network
    restart: unless-stopped

  # Optional: Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: pdf-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - pdf-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  pdf-network:
    driver: bridge