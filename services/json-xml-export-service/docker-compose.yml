version: '3.8'

services:
  json-xml-export-service:
    build: .
    ports:
      - "8015:8015"
      - "9015:9015"  # Metrics port
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/json_xml_export
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - JWT_SECRET_KEY=your-secret-key-change-this-in-production
    volumes:
      - ./exports:/tmp/json-xml-exports
    depends_on:
      - postgres
      - redis
    networks:
      - json-xml-export-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=json_xml_export
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5439:5432"
    networks:
      - json-xml-export-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6382:6379"
    networks:
      - json-xml-export-network

  adminer:
    image: adminer
    ports:
      - "8084:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - json-xml-export-network

volumes:
  postgres_data:
  redis_data:

networks:
  json-xml-export-network:
    driver: bridge