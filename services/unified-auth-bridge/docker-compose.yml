version: '3.8'

services:
  unified-auth-bridge:
    build: .
    container_name: unified-auth-bridge
    ports:
      - "8019:8019"
    environment:
      # Application Configuration
      - APP_NAME=Unified Authentication Bridge
      - APP_VERSION=1.0.0
      - DEBUG=true
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8019
      
      # Security Configuration
      - SECRET_KEY=your-development-secret-key-change-in-production-auth-bridge
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=30
      - JWT_REFRESH_EXPIRE_DAYS=7
      
      # Redis Configuration
      - REDIS_URL=redis://redis:6379/9
      - REDIS_PASSWORD=
      - REDIS_DB=9
      - REDIS_POOL_SIZE=10
      
      # External Services
      - API_GATEWAY_URL=http://api-gateway:8000
      - CLOUD_AUTH_SERVICE_URL=http://cloud-auth-service:8017
      - CLOUD_CONNECTION_MANAGER_URL=http://cloud-connection-manager:8018
      - NLP_ENGINE_URL=http://nlp-engine:8001
      
      # Splunk Enterprise Configuration (optional)
      - SPLUNK_ENTERPRISE_HOST=
      - SPLUNK_ENTERPRISE_PORT=8089
      - SPLUNK_ENTERPRISE_SCHEME=https
      - SPLUNK_ENTERPRISE_USERNAME=
      - SPLUNK_ENTERPRISE_PASSWORD=
      - SPLUNK_ENTERPRISE_TOKEN=
      
      # Splunk Cloud Configuration
      - SPLUNK_CLOUD_BASE_URL=https://api.splunkcloud.com
      - SPLUNK_CLOUD_API_VERSION=v1
      
      # Authentication Bridge Configuration
      - AUTH_BRIDGE_MODE=hybrid
      - AUTH_PRIORITY=cloud,enterprise
      - AUTH_FALLBACK_ENABLED=true
      - AUTH_CACHE_TTL=300
      
      # Session Management
      - SESSION_TIMEOUT_MINUTES=60
      - MAX_SESSIONS_PER_USER=5
      - SESSION_BRIDGE_ENABLED=true
      
      # Rate Limiting
      - RATE_LIMIT_REQUESTS_PER_MINUTE=200
      - RATE_LIMIT_BURST=20
      - RATE_LIMIT_ENABLED=true
      
      # Health Check Configuration
      - HEALTH_CHECK_INTERVAL=30
      - HEALTH_CHECK_TIMEOUT=10
      
      # Monitoring
      - PROMETHEUS_ENABLED=true
      
      # Logging
      - LOG_FORMAT=json
      - LOG_FILE=
    
    depends_on:
      - redis
    
    volumes:
      - ./logs:/app/logs
    
    networks:
      - auth-bridge-network
    
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: auth-bridge-redis
    ports:
      - "6382:6379"  # Use different port to avoid conflicts
    volumes:
      - redis_data:/data
    networks:
      - auth-bridge-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: auth-bridge-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379:9
    ports:
      - "8083:8081"
    depends_on:
      - redis
    networks:
      - auth-bridge-network
    profiles:
      - tools

volumes:
  redis_data:

networks:
  auth-bridge-network:
    driver: bridge