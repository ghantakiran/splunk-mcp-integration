version: '3.8'

services:
  user-adoption-service:
    build: .
    ports:
      - "8020:8000"
    environment:
      - DATABASE_URL=postgresql://adoption_user:adoption_pass@postgres:5432/user_adoption_db
      - REDIS_URL=redis://redis:6379/10
      - JWT_SECRET_KEY=your-secret-key-here
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    depends_on:
      - postgres
      - redis
    volumes:
      - ./app:/app/app
    networks:
      - user-adoption-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=user_adoption_db
      - POSTGRES_USER=adoption_user
      - POSTGRES_PASSWORD=adoption_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - user-adoption-network

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - user-adoption-network

volumes:
  postgres_data:
  redis_data:

networks:
  user-adoption-network:
    driver: bridge