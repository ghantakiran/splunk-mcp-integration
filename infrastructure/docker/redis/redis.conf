# Redis Configuration for Splunk MCP Integration
# Development environment settings

# Network settings
bind 0.0.0.0
port 6379
protected-mode yes

# Authentication
requirepass redis_password

# General settings
timeout 300
tcp-keepalive 300
tcp-backlog 511

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence settings
save 900 1
save 300 10
save 60 10000

# Enable AOF persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Database settings
databases 16

# Logging
loglevel notice
logfile ""

# Client settings
maxclients 10000

# Slow log settings
slowlog-log-slower-than 10000
slowlog-max-len 128

# Key expiration settings
notify-keyspace-events Ex

# Security settings
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command EVAL ""
rename-command DEBUG ""
rename-command CONFIG ""

# Performance tuning
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog settings
hll-sparse-max-bytes 3000

# Lua scripting
lua-time-limit 5000

# Latency monitoring
latency-monitor-threshold 100

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# TLS/SSL (disabled for development)
# tls-port 0

# Modules (none for basic setup)

# Redis Sentinel (not used in development)
# sentinel announce-ip
# sentinel announce-port

# Redis Cluster (not used in development)
# cluster-enabled no