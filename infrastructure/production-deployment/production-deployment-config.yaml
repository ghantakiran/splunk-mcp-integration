# Production Deployment Configuration
# =================================
# Comprehensive configuration for production deployment automation
# of the Splunk MCP Integration platform

# Deployment Settings
deployment_settings:
  # Target namespace for production deployment
  namespace: "splunk-mcp-prod"
  
  # Kubernetes configuration
  kubeconfig: "/etc/kubernetes/prod-kubeconfig"
  context: "splunk-mcp-production"
  
  # Deployment timeouts and retries
  timeout_minutes: 60
  max_retries: 3
  health_check_interval: 30
  
  # Rollback configuration
  rollback_enabled: true
  auto_rollback_on_failure: true
  rollback_timeout_minutes: 30
  
  # Deployment strategy
  deployment_strategy: "rolling"  # rolling, blue-green, canary
  max_unavailable: "25%"
  max_surge: "25%"
  
  # Resource management
  default_resource_requests:
    cpu: "100m"
    memory: "128Mi"
  default_resource_limits:
    cpu: "500m"
    memory: "512Mi"

# Infrastructure Configuration
infrastructure:
  # Kubernetes cluster specifications
  kubernetes_version: "1.28"
  cluster_name: "splunk-mcp-production"
  
  # Node pool configuration
  node_pools:
    system:
      size: 3
      machine_type: "e2-standard-4"
      disk_size: "100GB"
      disk_type: "pd-ssd"
      labels:
        workload-type: "system"
      taints:
        - key: "workload-type"
          value: "system"
          effect: "NoSchedule"
    
    workload:
      size: 5
      machine_type: "e2-standard-8"
      disk_size: "200GB"
      disk_type: "pd-ssd"
      labels:
        workload-type: "application"
      auto_scaling:
        enabled: true
        min_nodes: 3
        max_nodes: 15
    
    monitoring:
      size: 2
      machine_type: "e2-standard-4"
      disk_size: "100GB"
      disk_type: "pd-ssd"
      labels:
        workload-type: "monitoring"
  
  # Network configuration
  network:
    cluster_cidr: "10.0.0.0/16"
    services_cidr: "10.1.0.0/16"
    pods_cidr: "10.2.0.0/16"
    
    # Network policies
    network_policies_enabled: true
    default_deny_all: true
    allow_dns: true
    
    # Load balancer configuration
    load_balancer:
      type: "nginx"
      replicas: 3
      ssl_redirect: true
      rate_limiting: true
      ddos_protection: true

# Database Configuration
database:
  # PostgreSQL configuration
  postgresql:
    # High availability setup
    primary_replicas: 1
    read_replicas: 2
    
    # Storage configuration
    storage_size: "200Gi"
    storage_class: "fast-ssd"
    
    # Performance tuning
    shared_buffers: "512MB"
    effective_cache_size: "2GB"
    max_connections: 200
    
    # Backup configuration
    backup_retention_days: 30
    backup_schedule: "0 2 * * *"
    point_in_time_recovery: true
    
    # Monitoring
    metrics_enabled: true
    log_statement: "all"
    log_min_duration_statement: 1000
    
    # Security
    ssl_enabled: true
    ssl_cert_path: "/etc/ssl/certs/postgresql.crt"
    ssl_key_path: "/etc/ssl/private/postgresql.key"
  
  # Redis configuration
  redis:
    # Sentinel configuration for high availability
    sentinel_replicas: 3
    redis_replicas: 3
    
    # Memory configuration
    memory_limit: "8Gi"
    maxmemory_policy: "allkeys-lru"
    
    # Persistence
    save_enabled: true
    save_seconds: 900
    save_changes: 1
    
    # Performance
    tcp_keepalive: 300
    timeout: 0
    
    # Security
    auth_enabled: true
    ssl_enabled: true

# Monitoring Configuration
monitoring:
  # Prometheus configuration
  prometheus:
    # Data retention and storage
    retention: "30d"
    storage: "200Gi"
    storage_class: "fast-ssd"
    
    # Performance
    memory_limit: "4Gi"
    cpu_limit: "2"
    
    # Scrape configuration
    scrape_interval: "30s"
    evaluation_interval: "30s"
    
    # Rules and alerts
    alert_rules_enabled: true
    recording_rules_enabled: true
    
    # External integrations
    remote_write_enabled: false
    remote_read_enabled: false
  
  # Grafana configuration
  grafana:
    replicas: 2
    storage: "20Gi"
    
    # Performance
    memory_limit: "2Gi"
    cpu_limit: "1"
    
    # Authentication
    auth_enabled: true
    oauth_enabled: false
    
    # Features
    dashboards_auto_import: true
    alerts_enabled: true
    
    # Data sources
    datasources:
      - name: "Prometheus"
        type: "prometheus"
        url: "http://prometheus:9090"
      - name: "PostgreSQL"
        type: "postgres"
        url: "postgres://postgres:5432/splunk_mcp"
  
  # AlertManager configuration
  alertmanager:
    replicas: 2
    storage: "10Gi"
    
    # Notification channels
    email_enabled: true
    slack_enabled: true
    pagerduty_enabled: true
    
    # Routing
    group_wait: "10s"
    group_interval: "10s"
    repeat_interval: "1h"
  
  # Logging configuration
  logging:
    enabled: true
    log_level: "INFO"
    
    # Log aggregation
    fluentd_enabled: true
    elasticsearch_enabled: true
    
    # Retention
    log_retention_days: 30
    
    # Performance
    buffer_size: "32MB"
    flush_interval: "5s"

# Security Configuration
security:
  # TLS/SSL configuration
  tls_enabled: true
  tls_version: "1.3"
  cert_manager_enabled: true
  
  # Certificate configuration
  certificates:
    issuer: "letsencrypt-prod"
    auto_renewal: true
    
  # RBAC configuration
  rbac_enabled: true
  service_accounts:
    - name: "api-gateway-sa"
      namespace: "splunk-mcp-prod"
      permissions: ["get", "list", "watch"]
    - name: "nlp-engine-sa"
      namespace: "splunk-mcp-prod"
      permissions: ["get", "list"]
    - name: "monitoring-sa"
      namespace: "splunk-mcp-prod"
      permissions: ["get", "list", "watch", "create"]
  
  # Pod security
  pod_security_policies_enabled: true
  pod_security_standards: "restricted"
  
  # Network security
  network_policies_enabled: true
  default_deny_ingress: true
  default_deny_egress: false
  
  # Secrets management
  secrets_encryption_enabled: true
  external_secrets_enabled: false
  
  # Image security
  image_pull_policy: "Always"
  image_scanning_enabled: true
  vulnerability_scanning: true

# Application Services Configuration
applications:
  # Core services
  api_gateway:
    replicas: 3
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    
    # Auto-scaling
    hpa:
      enabled: true
      min_replicas: 3
      max_replicas: 10
      target_cpu: 70
      target_memory: 80
    
    # Health checks
    health_check:
      path: "/health"
      port: 8000
      initial_delay: 30
      period: 10
      timeout: 5
      failure_threshold: 3
    
    # Environment variables
    env:
      LOG_LEVEL: "INFO"
      METRICS_ENABLED: "true"
      TRACING_ENABLED: "true"
  
  nlp_engine:
    replicas: 2
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    
    hpa:
      enabled: true
      min_replicas: 2
      max_replicas: 8
      target_cpu: 75
      target_memory: 85
    
    health_check:
      path: "/health"
      port: 8001
      initial_delay: 60
      period: 15
      timeout: 10
      failure_threshold: 3
    
    env:
      MODEL_CACHE_SIZE: "2GB"
      MAX_WORKERS: "4"
  
  visualization:
    replicas: 2
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
    
    hpa:
      enabled: true
      min_replicas: 2
      max_replicas: 6
      target_cpu: 70
    
    health_check:
      path: "/health"
      port: 8002
      initial_delay: 30
      period: 10
  
  alert_manager:
    replicas: 2
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    
    hpa:
      enabled: true
      min_replicas: 2
      max_replicas: 4
      target_cpu: 70
    
    health_check:
      path: "/health"
      port: 8003
      initial_delay: 30
      period: 10
  
  # Frontend application
  frontend:
    replicas: 3
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "256Mi"
    
    hpa:
      enabled: true
      min_replicas: 3
      max_replicas: 12
      target_cpu: 60
    
    health_check:
      path: "/health"
      port: 3000
      initial_delay: 20
      period: 10

# Storage Configuration
storage:
  # Storage classes
  storage_classes:
    fast_ssd:
      provisioner: "kubernetes.io/gce-pd"
      type: "pd-ssd"
      replication_type: "regional-pd"
      
    standard:
      provisioner: "kubernetes.io/gce-pd"
      type: "pd-standard"
      replication_type: "regional-pd"
      
    backup:
      provisioner: "kubernetes.io/gce-pd"
      type: "pd-standard"
      replication_type: "regional-pd"
  
  # Persistent volumes
  persistent_volumes:
    postgresql_data:
      size: "200Gi"
      storage_class: "fast-ssd"
      access_modes: ["ReadWriteOnce"]
      
    redis_data:
      size: "50Gi"
      storage_class: "fast-ssd"
      access_modes: ["ReadWriteOnce"]
      
    prometheus_data:
      size: "200Gi"
      storage_class: "fast-ssd"
      access_modes: ["ReadWriteOnce"]
      
    grafana_data:
      size: "20Gi"
      storage_class: "standard"
      access_modes: ["ReadWriteOnce"]

# Networking Configuration
networking:
  # Ingress configuration
  ingress:
    enabled: true
    controller: "nginx"
    
    # SSL/TLS
    ssl_enabled: true
    ssl_redirect: true
    cert_manager: true
    
    # Security
    rate_limiting:
      enabled: true
      requests_per_minute: 1000
      burst: 2000
    
    # CORS
    cors_enabled: true
    cors_origins: ["https://splunk-mcp.company.com"]
    
    # Compression
    gzip_enabled: true
    gzip_types: ["text/plain", "application/json", "application/javascript"]
  
  # Service mesh (optional)
  service_mesh:
    enabled: false
    type: "istio"
  
  # DNS configuration
  dns:
    cluster_domain: "cluster.local"
    dns_policy: "ClusterFirst"

# Backup and Disaster Recovery
backup:
  # Automated backup configuration
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  
  # Backup retention
  retention:
    daily: 30
    weekly: 12
    monthly: 12
  
  # Backup destinations
  destinations:
    primary: "s3://splunk-mcp-backups-prod"
    secondary: "gs://splunk-mcp-dr-backups"
  
  # Verification
  verification_enabled: true
  test_restore_schedule: "0 6 * * 0"  # Weekly test restore

# Performance and Scaling
performance:
  # Resource quotas
  resource_quotas:
    cpu_requests: "20"
    cpu_limits: "40" 
    memory_requests: "40Gi"
    memory_limits: "80Gi"
    persistent_volume_claims: "50"
  
  # Quality of Service
  qos_classes:
    guaranteed: ["postgresql", "redis"]
    burstable: ["api-gateway", "nlp-engine"]
    best_effort: []
  
  # Pod disruption budgets
  pod_disruption_budgets:
    api_gateway:
      min_available: "50%"
    nlp_engine:
      min_available: 1
    postgresql:
      max_unavailable: 0

# Observability Configuration
observability:
  # Metrics
  metrics:
    enabled: true
    collection_interval: "30s"
    retention: "30d"
    
    # Custom metrics
    custom_metrics:
      - name: "query_response_time"
        type: "histogram"
      - name: "active_users"
        type: "gauge"
      - name: "spl_translations_total"
        type: "counter"
  
  # Tracing
  tracing:
    enabled: true
    sampling_rate: 0.1
    jaeger_enabled: true
  
  # Logging
  logging:
    structured_logging: true
    log_format: "json"
    correlation_id_enabled: true

# Compliance and Governance
compliance:
  # Regulatory compliance
  frameworks: ["SOX", "GDPR", "HIPAA", "SOC2"]
  
  # Audit logging
  audit_logging:
    enabled: true
    log_requests: true
    log_responses: false
    retention_days: 2555  # 7 years
  
  # Data governance
  data_governance:
    encryption_at_rest: true
    encryption_in_transit: true
    data_classification: true
    
  # Access controls
  access_controls:
    mfa_required: true
    session_timeout: 30
    password_policy_enforced: true

# Environment-Specific Overrides
environments:
  production:
    replicas_multiplier: 1.0
    resource_multiplier: 1.0
    monitoring_level: "comprehensive"
    
  staging:
    replicas_multiplier: 0.5
    resource_multiplier: 0.5
    monitoring_level: "standard"
    
  development:
    replicas_multiplier: 0.3
    resource_multiplier: 0.3
    monitoring_level: "basic"

# Notification Configuration
notifications:
  # Deployment notifications
  deployment:
    success:
      channels: ["email", "slack"]
      recipients: ["ops-team@company.com"]
      
    failure:
      channels: ["email", "slack", "pagerduty"]
      recipients: ["ops-team@company.com", "dev-team@company.com"]
      escalation_delay: 15
  
  # Health check notifications
  health_checks:
    critical:
      channels: ["slack", "pagerduty"]
      immediate: true
      
    warning:
      channels: ["slack"]
      batched: true
      batch_interval: 300

# Integration Configuration
integrations:
  # External services
  splunk:
    enterprise_host: "https://splunk.company.com"
    cloud_host: "https://company.splunkcloud.com"
    
  # Third-party tools
  servicenow:
    enabled: true
    instance_url: "https://company.service-now.com"
    
  slack:
    enabled: true
    workspace: "company-workspace"
    
  # CI/CD integration
  cicd:
    github_actions: true
    deployment_triggers: ["push", "release"]