# Prometheus Alerting Rules for Splunk MCP Integration Platform
# ============================================================

groups:
  # High Priority - Critical Service Alerts
  - name: critical-services
    interval: 30s
    rules:
      # Service Down Alerts
      - alert: ServiceDown
        expr: up{job=~"api-gateway|nlp-engine|visualization|alert-manager"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Critical service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 2 minutes."
          runbook_url: "https://docs.splunk-mcp.com/runbooks/service-down"

      # High Response Time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=~"api-gateway|nlp-engine"}[5m])) > 3
        for: 5m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "High response time for {{ $labels.job }}"
          description: "95th percentile response time for {{ $labels.job }} is {{ $value }}s"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/high-response-time"

      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 3m
        labels:
          severity: critical
          category: reliability
        annotations:
          summary: "High error rate for {{ $labels.job }}"
          description: "Error rate for {{ $labels.job }} is {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/high-error-rate"

  # Infrastructure Alerts
  - name: infrastructure
    interval: 60s
    rules:
      # Database Connection Issues
      - alert: DatabaseConnectionFailure
        expr: postgresql_up == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "PostgreSQL database is unreachable"
          description: "PostgreSQL database has been unreachable for more than 1 minute."
          runbook_url: "https://docs.splunk-mcp.com/runbooks/database-failure"

      # High Database Connection Usage
      - alert: HighDatabaseConnections
        expr: postgresql_connections_active / postgresql_connections_max > 0.8
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High database connection usage"
          description: "Database connection usage is {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/database-connections"

      # Redis Down
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Redis cache is down"
          description: "Redis cache has been unreachable for more than 1 minute."
          runbook_url: "https://docs.splunk-mcp.com/runbooks/redis-failure"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/redis-memory"

  # Kubernetes Cluster Alerts
  - name: kubernetes
    interval: 60s
    rules:
      # Pod Crash Looping
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
          category: kubernetes
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting frequently."
          runbook_url: "https://docs.splunk-mcp.com/runbooks/pod-crash-loop"

      # Pod Not Ready
      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="false",namespace="splunk-mcp-prod"} == 1
        for: 10m
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: "Pod {{ $labels.pod }} not ready"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for more than 10 minutes."
          runbook_url: "https://docs.splunk-mcp.com/runbooks/pod-not-ready"

      # Node Not Ready
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
          category: kubernetes
        annotations:
          summary: "Node {{ $labels.node }} not ready"
          description: "Node {{ $labels.node }} has been not ready for more than 5 minutes."
          runbook_url: "https://docs.splunk-mcp.com/runbooks/node-not-ready"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: (100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High CPU usage on node {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% on node {{ $labels.instance }}"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/high-cpu"

      # High Memory Usage
      - alert: HighNodeMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High memory usage on node {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanizePercentage }} on node {{ $labels.instance }}"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/high-memory"

  # Application-Specific Alerts
  - name: application-metrics
    interval: 60s
    rules:
      # NLP Processing Queue Backup
      - alert: NLPQueueBackup
        expr: nlp_processing_queue_size > 100
        for: 5m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "NLP processing queue backup"
          description: "NLP processing queue has {{ $value }} pending items"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/nlp-queue-backup"

      # High Authentication Failures
      - alert: HighAuthFailures
        expr: rate(auth_failures_total[5m]) > 1
        for: 3m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "High authentication failure rate"
          description: "Authentication failure rate is {{ $value }} failures/second"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/auth-failures"

      # Export Service Failures
      - alert: ExportServiceFailures
        expr: rate(export_job_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "High export service failure rate"
          description: "Export service failure rate is {{ $value }} failures/second for {{ $labels.service }}"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/export-failures"

      # Long Running Queries
      - alert: LongRunningQueries
        expr: query_duration_seconds > 300
        for: 1m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Long running query detected"
          description: "Query {{ $labels.query_id }} has been running for {{ $value }}s"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/long-queries"

  # Security Alerts
  - name: security
    interval: 60s
    rules:
      # SSL Certificate Expiration
      - alert: SSLCertificateExpiring
        expr: ssl_certificate_expiry_days < 30
        for: 1h
        labels:
          severity: warning
          category: security
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value }} days"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/ssl-expiry"

      # Suspicious API Activity
      - alert: SuspiciousAPIActivity
        expr: rate(http_requests_total{status="401"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Suspicious API activity detected"
          description: "High rate of 401 responses: {{ $value }} requests/second"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/suspicious-activity"

  # Business Metrics
  - name: business-metrics
    interval: 300s
    rules:
      # Low User Activity
      - alert: LowUserActivity
        expr: rate(user_sessions_total[1h]) < 0.1
        for: 30m
        labels:
          severity: info
          category: business
        annotations:
          summary: "Low user activity detected"
          description: "User session rate is {{ $value }} sessions/hour"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/low-activity"

      # High Report Generation Volume
      - alert: HighReportVolume
        expr: rate(reports_generated_total[1h]) > 100
        for: 15m
        labels:
          severity: info
          category: business
        annotations:
          summary: "High report generation volume"
          description: "Report generation rate is {{ $value }} reports/hour"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/high-report-volume"

  # Data Quality Alerts
  - name: data-quality
    interval: 300s
    rules:
      # Data Freshness
      - alert: StaleData
        expr: (time() - data_last_updated_timestamp) > 3600
        for: 5m
        labels:
          severity: warning
          category: data-quality
        annotations:
          summary: "Stale data detected"
          description: "Data for {{ $labels.source }} is {{ $value }}s old"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/stale-data"

      # Missing Data
      - alert: MissingData
        expr: data_points_received_total == 0
        for: 15m
        labels:
          severity: critical
          category: data-quality
        annotations:
          summary: "No data received"
          description: "No data points received from {{ $labels.source }} for 15 minutes"
          runbook_url: "https://docs.splunk-mcp.com/runbooks/missing-data"