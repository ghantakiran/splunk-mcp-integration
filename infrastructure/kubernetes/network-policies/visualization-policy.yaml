---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visualization-policy
  namespace: splunk-mcp-prod
  labels:
    app: visualization
    policy-type: service-specific
    environment: production
spec:
  podSelector:
    matchLabels:
      app: visualization
      component: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
          component: backend
    ports:
    - protocol: TCP
      port: 8002
  - from:
    - podSelector:
        matchLabels:
          app: nlp-engine
          component: backend
    ports:
    - protocol: TCP
      port: 8002
  - from:
    - namespaceSelector:
        matchLabels:
          name: splunk-mcp-monitoring-prod
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: nlp-engine
          component: backend
    ports:
    - protocol: TCP
      port: 8001
  - to:
    - podSelector:
        matchLabels:
          app: redis
          environment: production
    ports:
    - protocol: TCP
      port: 6379
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
