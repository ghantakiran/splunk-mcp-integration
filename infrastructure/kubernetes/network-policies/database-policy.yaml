---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  namespace: splunk-mcp-prod
  labels:
    app: postgres
    policy-type: database-specific
    environment: production
spec:
  podSelector:
    matchLabels:
      app: postgres
      environment: production
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
          component: backend
    - podSelector:
        matchLabels:
          app: alert-manager
          component: backend
    - podSelector:
        matchLabels:
          app: backup
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          name: splunk-mcp-monitoring-prod
    ports:
    - protocol: TCP
      port: 5432
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
