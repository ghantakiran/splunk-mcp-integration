---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-manager-policy
  namespace: splunk-mcp-prod
  labels:
    app: alert-manager
    policy-type: service-specific
    environment: production
spec:
  podSelector:
    matchLabels:
      app: alert-manager
      component: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
          component: backend
    ports:
    - protocol: TCP
      port: 8003
  - from:
    - namespaceSelector:
        matchLabels:
          name: splunk-mcp-monitoring-prod
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
          environment: production
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
          environment: production
    ports:
    - protocol: TCP
      port: 6379
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 587
    - protocol: TCP
      port: 25
