---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visualization
  namespace: splunk-mcp-prod
  labels:
    app: visualization
    component: backend
    environment: production
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: visualization
      component: backend
  template:
    metadata:
      labels:
        app: visualization
        component: backend
        environment: production
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: visualization-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
      - name: visualization
        image: splunk-mcp/visualization:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8002
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: url
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: visualization-config
              key: log-level
        - name: CHART_CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: visualization-config
              key: chart-cache-ttl
        - name: MAX_CHART_SIZE
          valueFrom:
            configMapKeyRef:
              name: visualization-config
              key: max-chart-size
        - name: EXPORT_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: visualization-config
              key: export-timeout
        - name: DASHBOARD_CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: visualization-config
              key: dashboard-cache-ttl
        resources:
          requests:
            memory: "768Mi"
            cpu: "600m"
          limits:
            memory: "1.5Gi"
            cpu: "1200m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
        - name: charts
          mountPath: /app/charts
        - name: exports
          mountPath: /app/exports
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: charts
        emptyDir:
          sizeLimit: 2Gi
      - name: exports
        emptyDir:
          sizeLimit: 5Gi
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - visualization
              topologyKey: kubernetes.io/hostname
---
apiVersion: apps/v1
kind: Deployment
metadata:
