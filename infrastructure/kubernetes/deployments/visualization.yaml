        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: url
        - name: LOG_LEVEL
          value: "DEBUG"
        - name: CHART_CACHE_TTL
          value: "300"
        - name: MAX_CHART_SIZE
          value: "10"
        - name: EXPORT_TIMEOUT
          value: "30"
        - name: DASHBOARD_CACHE_TTL
          value: "600"
        resources:
          requests:
            memory: "384Mi"
            cpu: "300m"
          limits:
            memory: "768Mi"
            cpu: "600m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
