apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: splunk-mcp-prod
  labels:
    app: database
    environment: production
type: Opaque
data:
  # These values should be populated from AWS Secrets Manager or external secret management
  # Use external-secrets operator or similar to populate from AWS Secrets Manager
  POSTGRES_PASSWORD: ""  # Base64 encoded password from Terraform output
  DATABASE_URL: ""       # Base64 encoded full database URL
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: splunk-mcp-prod
  labels:
    app: redis
    environment: production
type: Opaque
data:
  # These values should be populated from AWS Secrets Manager
  REDIS_PASSWORD: ""     # Base64 encoded Redis password from Terraform output
  REDIS_URL: ""          # Base64 encoded full Redis URL
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: splunk-mcp-prod
  labels:
    app: api-gateway
    environment: production
type: Opaque
data:
  # Generate with: openssl rand -base64 64
  JWT_SECRET_KEY: ""     # Base64 encoded JWT secret key
  SESSION_SECRET_KEY: "" # Base64 encoded session secret key
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-api-keys
  namespace: splunk-mcp-prod
  labels:
    app: nlp-engine
    environment: production
type: Opaque
data:
  # API keys for AI providers
  OPENAI_API_KEY: ""     # Base64 encoded OpenAI API key
  ANTHROPIC_API_KEY: ""  # Base64 encoded Anthropic API key
---
apiVersion: v1
kind: Secret
metadata:
  name: splunk-credentials
  namespace: splunk-mcp-prod
  labels:
    app: splunk-integration
    environment: production
type: Opaque
data:
  # Splunk server credentials
  SPLUNK_USERNAME: ""    # Base64 encoded Splunk username
  SPLUNK_PASSWORD: ""    # Base64 encoded Splunk password
  SPLUNK_TOKEN: ""       # Base64 encoded Splunk authentication token
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: splunk-mcp-prod
  labels:
    app: alert-manager
    environment: production
type: Opaque
data:
  # Email notification credentials
  SMTP_USERNAME: ""      # Base64 encoded SMTP username
  SMTP_PASSWORD: ""      # Base64 encoded SMTP password
  
  # Slack bot credentials
  SLACK_BOT_TOKEN: ""    # Base64 encoded Slack bot token
  SLACK_SIGNING_SECRET: "" # Base64 encoded Slack signing secret
  
  # Microsoft Teams credentials
  TEAMS_APP_ID: ""       # Base64 encoded Teams app ID
  TEAMS_APP_PASSWORD: "" # Base64 encoded Teams app password
  
  # Webhook secrets
  WEBHOOK_SECRET: ""     # Base64 encoded webhook secret for HMAC validation
---
apiVersion: v1
kind: Secret
metadata:
  name: ssl-certificates
  namespace: splunk-mcp-prod
  labels:
    component: ingress
    environment: production
type: kubernetes.io/tls
data:
  # SSL/TLS certificates for HTTPS
  tls.crt: ""           # Base64 encoded SSL certificate
  tls.key: ""           # Base64 encoded SSL private key
---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secrets
  namespace: splunk-mcp-prod
  labels:
    component: monitoring
    environment: production
type: Opaque
data:
  # Monitoring and observability credentials
  JAEGER_USERNAME: ""    # Base64 encoded Jaeger username
  JAEGER_PASSWORD: ""    # Base64 encoded Jaeger password
  PROMETHEUS_USERNAME: "" # Base64 encoded Prometheus username
  PROMETHEUS_PASSWORD: "" # Base64 encoded Prometheus password
  GRAFANA_ADMIN_PASSWORD: "" # Base64 encoded Grafana admin password
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-credentials
  namespace: splunk-mcp-prod
  labels:
    component: backup
    environment: production
type: Opaque
data:
  # Backup storage credentials
  AWS_ACCESS_KEY_ID: ""     # Base64 encoded AWS access key for backups
  AWS_SECRET_ACCESS_KEY: "" # Base64 encoded AWS secret key for backups
  S3_BUCKET_NAME: ""        # Base64 encoded S3 bucket name for backups
---
# External Secrets Operator configuration to populate secrets from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: splunk-mcp-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        secretRef:
          accessKeyID:
            name: aws-secret
            key: access-key
          secretAccessKey:
            name: aws-secret
            key: secret-access-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-external-secret
  namespace: splunk-mcp-prod
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: database-secret
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: /splunk-mcp-prod/database/credentials
      property: password
  - secretKey: DATABASE_URL
    remoteRef:
      key: /splunk-mcp-prod/database/credentials
      property: url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-external-secret
  namespace: splunk-mcp-prod
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: redis-secret
    creationPolicy: Owner
  data:
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: /splunk-mcp-prod/redis/credentials
      property: password
  - secretKey: REDIS_URL
    remoteRef:
      key: /splunk-mcp-prod/redis/credentials
      property: url