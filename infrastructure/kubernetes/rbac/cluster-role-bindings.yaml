apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: splunk-mcp-monitoring-cluster-rolebinding
  labels:
    app: monitoring
    component: observability
    environment: production
subjects:
- kind: ServiceAccount
  name: monitoring-sa
  namespace: splunk-mcp-monitoring-prod
- kind: ServiceAccount
  name: monitoring-sa
  namespace: splunk-mcp-monitoring-dev
roleRef:
  kind: ClusterRole
  name: splunk-mcp-monitoring-cluster-role
  apiGroup: rbac.authorization.k8s.io
