---
apiVersion: v1
kind: Service
metadata:
  name: alert-manager
  namespace: splunk-mcp-prod
  labels:
    app: alert-manager
    component: backend
    environment: production
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8003"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: alert-manager
    component: backend
  ports:
  - name: http
    port: 8003
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: alert-manager-dev
  namespace: splunk-mcp-dev
  labels:
    app: alert-manager
    component: backend
    environment: development
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8003"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: alert-manager
    component: backend
  ports:
  - name: http
    port: 8003
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: alert-manager-headless
  namespace: splunk-mcp-prod
  labels:
    app: alert-manager
    component: backend
    environment: production
    service-type: headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: alert-manager
    component: backend
  ports:
  - name: http
    port: 8003
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP