---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: splunk-mcp-prod
  labels:
    app: postgres
    environment: production
    service-type: headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: postgres
    environment: production
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: splunk-mcp-prod
  labels:
    app: postgres
    environment: production
spec:
  type: ClusterIP
  selector:
    app: postgres
    environment: production
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
    protocol: TCP
