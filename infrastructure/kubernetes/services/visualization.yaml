---
apiVersion: v1
kind: Service
metadata:
  name: visualization
  namespace: splunk-mcp-prod
  labels:
    app: visualization
    component: backend
    environment: production
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8002"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: visualization
    component: backend
  ports:
  - name: http
    port: 8002
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: visualization-dev
  namespace: splunk-mcp-dev
  labels:
    app: visualization
    component: backend
    environment: development
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8002"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: visualization
    component: backend
  ports:
  - name: http
    port: 8002
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: visualization-headless
  namespace: splunk-mcp-prod
  labels:
    app: visualization
    component: backend
    environment: production
    service-type: headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: visualization
    component: backend
  ports:
  - name: http
    port: 8002
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP