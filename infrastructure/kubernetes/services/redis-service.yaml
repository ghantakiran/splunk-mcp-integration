---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: splunk-mcp-prod
  labels:
    app: redis
    environment: production
    service-type: headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: redis
    environment: production
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: splunk-mcp-prod
  labels:
    app: redis
    environment: production
spec:
  type: ClusterIP
  selector:
    app: redis
    environment: production
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
