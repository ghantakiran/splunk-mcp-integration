---
apiVersion: v1
kind: Secret
metadata:
  name: smtp-secret
  namespace: splunk-mcp-prod
  labels:
    app: alert-manager
    environment: production
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  # echo -n "smtp.gmail.com" | base64
  host: c210cC5nbWFpbC5jb20=
  # echo -n "587" | base64
  port: NTg3
  # echo -n "your-email@gmail.com" | base64
  username: eW91ci1lbWFpbEBnbWFpbC5jb20=
  # echo -n "your-email-password" | base64
  password: eW91ci1lbWFpbC1wYXNzd29yZA==
  # echo -n "true" | base64
  use-tls: dHJ1ZQ==
  # echo -n "Splunk MCP Alerts" | base64
  from-name: U3BsdW5rIE1DUCBBbGVydHM=
  # echo -n "alerts@splunk-mcp.com" | base64
  from-email: YWxlcnRzQHNwbHVuay1tY3AuY29t
---
apiVersion: v1
