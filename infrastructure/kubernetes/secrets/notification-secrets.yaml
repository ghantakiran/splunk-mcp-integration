  # echo -n "xoxb-your-slack-bot-token" | base64
  bot-token: eG94Yi15b3VyLXNsYWNrLWJvdC10b2tlbg==
  # echo -n "#alerts" | base64
  default-channel: I2FsZXJ0cw==
---
apiVersion: v1
