metadata:
  name: redis-secret
  namespace: production
  labels:
    app: redis
    tier: database
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  # Example generation: echo -n "your-password" | base64
  password: UmVkaXNQYXNzd29yZCEyMDI1  # RedisPassword!2025
  webhook-url: aHR0cHM6Ly9ob29rcy5zbGFjay5jb20vc2VydmljZXMvWU9VUi9XRUJIT09LL1VSTC9IRVJFCg==  # https://hooks.slack.com/services/YOUR/WEBHOOK/URL/HERE

