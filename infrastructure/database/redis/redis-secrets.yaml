  labels:
    app: redis
    tier: database
type: kubernetes.io/tls
data:
  # TLS certificates for Redis encryption
  # Generate with: openssl req -x509 -newkey rsa:4096 -keyout redis.key -out redis.crt -days 365 -nodes
  tls.crt: |
    
  tls.key: |
    