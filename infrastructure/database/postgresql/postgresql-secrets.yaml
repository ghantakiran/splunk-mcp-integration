apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: production
  labels:
    app: postgresql
    tier: database
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  # Example generation: echo -n "your-password" | base64
  username: c3BsdW5rX3VzZXI=  # splunk_user
  password: U3BsdW5rUGFzc3cwcmQhMjAyNQ==  # SplunkPassw0rd!2025
  replication-password: UmVwbGljYXRpb25QYXNzd29yZCEyMDI1  # ReplicationPassword!2025
  postgres-password: UG9zdGdyZXNBZG1pblBhc3N3b3JkITIwMjU=  # PostgresAdminPassword!2025

---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-ssl-certs
  namespace: production
  labels:
    app: postgresql
    tier: database
type: Opaque
data:
  # SSL certificates - replace with actual certificates
  # Generate with: openssl req -x509 -newkey rsa:4096 -keyout server.key -out server.crt -days 365 -nodes
  ca.crt: |
    
  server.crt: |
    

---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-ssl-private
  namespace: production
  labels:
    app: postgresql
    tier: database
type: Opaque
data:
  # Private SSL key - replace with actual key
  server.key: |
    

