apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-replica-config
  namespace: production
  labels:
    app: postgresql
    role: replica
    tier: database
data:
  postgresql.conf: |
    # Replica PostgreSQL Configuration for High Availability
    
    # Connection Settings
    listen_addresses = '*'
    port = 5432
    max_connections = 200
    superuser_reserved_connections = 3
    
    # Memory Settings
    shared_buffers = 256MB
    effective_cache_size = 1GB
    work_mem = 4MB
    maintenance_work_mem = 64MB
    
    # Write-Ahead Logging (WAL) Settings
    wal_level = replica
    max_wal_size = 1GB
    min_wal_size = 80MB
    checkpoint_completion_target = 0.9
    
    # Standby Settings
    hot_standby = on
    max_standby_archive_delay = 30s
    max_standby_streaming_delay = 30s
    hot_standby_feedback = on
    
    # Replication Settings
    max_wal_senders = 10
    max_replication_slots = 10
    wal_keep_segments = 32
    
    # Archiving Settings (replica can also archive)
    archive_mode = on
    archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'
    archive_timeout = 60
    
    # Logging Settings
    logging_collector = on
    log_directory = 'pg_log'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_min_duration_statement = 1000
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_checkpoints = on
    log_connections = on
    log_disconnections = on
    log_lock_waits = on
    log_statement = 'ddl'
    
    # Performance Settings
    random_page_cost = 1.1
    effective_io_concurrency = 200
    
    # Security Settings
    ssl = on
    ssl_cert_file = '/etc/ssl/certs/server.crt'
    ssl_key_file = '/etc/ssl/private/server.key'
    ssl_ca_file = '/etc/ssl/certs/ca.crt'
    ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'
    ssl_prefer_server_ciphers = on
    
    # Background Writer Settings
    bgwriter_delay = 200ms
    bgwriter_lru_maxpages = 100
    bgwriter_lru_multiplier = 2.0
    
    # Auto Vacuum Settings
    autovacuum = on
    autovacuum_max_workers = 3
    autovacuum_naptime = 20s
    autovacuum_vacuum_threshold = 50
    autovacuum_analyze_threshold = 50
    
  pg_hba.conf: |
    # Replica PostgreSQL Host-Based Authentication Configuration
    
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    
    # "local" is for Unix domain socket connections only
    local   all             all                                     peer
    
    # IPv4 local connections:
    host    all             all             127.0.0.1/32            md5
    
    # IPv6 local connections:
    host    all             all             ::1/128                 md5
    
    # Replication connections
    host    replication     replicator      0.0.0.0/0              md5
    
    # Application connections (read-only)
    host    all             splunk_user     10.0.0.0/8             md5
    host    all             splunk_user     172.16.0.0/12          md5
    host    all             splunk_user     192.168.0.0/16         md5
    
    # Monitoring connections
    host    all             postgres_exporter 10.0.0.0/8           md5
    
    # Deny all other connections
    host    all             all             0.0.0.0/0              reject

  recovery.conf: |
    # Recovery configuration for replica
    standby_mode = 'on'
    primary_conninfo = 'host=postgresql-primary.production.svc.cluster.local port=5432 user=replicator password=${POSTGRES_REPLICATION_PASSWORD} application_name=replica1'
    trigger_file = '/tmp/postgresql.trigger'
    recovery_target_timeline = 'latest'
    restore_command = 'cp /var/lib/postgresql/archive/%f %p'
    archive_cleanup_command = 'pg_archivecleanup /var/lib/postgresql/archive %r'

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-replica
  namespace: production
  labels:
    app: postgresql
    role: replica
    tier: database
spec:
  serviceName: postgresql-replica
  replicas: 2
  selector:
    matchLabels:
      app: postgresql
      role: replica
  template:
    metadata:
      labels:
        app: postgresql
        role: replica
        tier: database
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
      initContainers:
      - name: init-replica
        image: postgres:14-alpine
        env:
        - name: POSTGRES_REPLICATION_USER
          value: "replicator"
        - name: POSTGRES_REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: replication-password
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        command:
        - /bin/bash
        - -c
        - |
          set -e
          if [ ! -f "$PGDATA/PG_VERSION" ]; then
            echo "Creating base backup from primary..."
            pg_basebackup -h postgresql-primary.production.svc.cluster.local -D $PGDATA -U replicator -W -v -P -R
            echo "Base backup completed"
          else
            echo "Data directory already exists, skipping base backup"
          fi
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
        - name: postgresql-archive
          mountPath: /var/lib/postgresql/archive
      containers:
      - name: postgresql
        image: postgres:14-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_DB
          value: "splunk_mcp"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: password
        - name: POSTGRES_REPLICATION_USER
          value: "replicator"
        - name: POSTGRES_REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: replication-password
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        ports:
        - containerPort: 5432
          name: postgresql
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
        - name: postgresql-config
          mountPath: /etc/postgresql/postgresql.conf
          subPath: postgresql.conf
        - name: postgresql-config
          mountPath: /etc/postgresql/pg_hba.conf
          subPath: pg_hba.conf
        - name: postgresql-config
          mountPath: /var/lib/postgresql/data/pgdata/recovery.conf
          subPath: recovery.conf
        - name: postgresql-archive
          mountPath: /var/lib/postgresql/archive
        - name: ssl-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        - name: ssl-private
          mountPath: /etc/ssl/private
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - pg_ctl stop -D $PGDATA -s -m fast
      volumes:
      - name: postgresql-config
        configMap:
          name: postgresql-replica-config
      - name: postgresql-archive
        persistentVolumeClaim:
          claimName: postgresql-archive-pvc
      - name: ssl-certs
        secret:
          secretName: postgresql-ssl-certs
      - name: ssl-private
        secret:
          secretName: postgresql-ssl-private
  volumeClaimTemplates:
  - metadata:
      name: postgresql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 100Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-replica
  namespace: production
  labels:
    app: postgresql
    role: replica
    tier: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
  selector:
    app: postgresql
    role: replica

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-replica-read
  namespace: production
  labels:
    app: postgresql
    role: replica
    tier: database
    service-type: read-only
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
  selector:
    app: postgresql
    role: replica