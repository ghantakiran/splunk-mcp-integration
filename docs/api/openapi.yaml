openapi: 3.0.3
info:
  title: Splunk MCP Integration API
  description: |
    Comprehensive REST API for the Splunk MCP Integration platform that enables 
    natural language interactions with Splunk data through multiple microservices.
    
    ## Features
    - Natural language query processing
    - Real-time chart and dashboard generation
    - Multi-channel alert management
    - Automated report scheduling and delivery
    - Integration with external tools (Slack, Teams, ITSM, BI)
    
    ## Authentication
    All API requests require JWT authentication. Obtain a token by calling the `/auth/login` endpoint.
    
    ## Rate Limiting
    - Default: 1000 requests/hour per authenticated user
    - Burst protection: 10 requests/second maximum
    - Headers: `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`
    
  version: "1.0.0"
  contact:
    name: Splunk MCP API Support
    email: support@splunk-mcp.com
    url: https://docs.splunk-mcp.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://splunk-mcp.com/terms

servers:
  - url: https://api.splunk-mcp.com
    description: Production server
  - url: https://staging-api.splunk-mcp.com
    description: Staging server
  - url: http://localhost:8000
    description: Development server

paths:
  # Authentication endpoints
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and obtain JWT access and refresh tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "john.doe"
                password:
                  type: string
                  format: password
                  example: "securePassword123"
            examples:
              standard_login:
                summary: Standard user login
                value:
                  username: "john.doe"
                  password: "securePassword123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success_response:
                  summary: Successful login
                  value:
                    success: true
                    data:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_type: "Bearer"
                      expires_in: 3600
                      user:
                        id: "user_123"
                        username: "john.doe"
                        email: "john.doe@company.com"
                        roles: ["user", "analyst"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Invalidate the current user session and tokens
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Obtain a new access token using a valid refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Health endpoints
  /health:
    get:
      tags:
        - System
      summary: System health check
      description: Check overall system health and service status
      operationId: getSystemHealth
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                    example: "2025-01-22T10:30:00Z"
                  services:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                          enum: [up, down, degraded]
                        response_time_ms:
                          type: number
                        last_checked:
                          type: string
                          format: date-time
                  version:
                    type: string
                    example: "1.0.0"

  # NLP Processing endpoints
  /api/v1/nlp/process-query:
    post:
      tags:
        - NLP Engine
      summary: Process natural language query
      description: |
        Convert natural language text into SPL query and execute it.
        Supports context management and conversation flow.
      operationId: processNaturalLanguageQuery
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Natural language query
                  example: "show me errors from the last hour with high severity"
                conversation_id:
                  type: string
                  description: Conversation context identifier
                  example: "conv_abc123"
                context:
                  type: object
                  description: Additional context for query processing
                  properties:
                    user_preferences:
                      type: object
                    previous_queries:
                      type: array
                      items:
                        type: string
                options:
                  type: object
                  properties:
                    include_visualization:
                      type: boolean
                      default: false
                    max_results:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      default: 1000
            examples:
              basic_query:
                summary: Basic error query
                value:
                  query: "show me errors from the last hour"
                  conversation_id: "conv_123"
              complex_query:
                summary: Complex query with visualization
                value:
                  query: "show me top 10 sources with most errors in the last 24 hours and create a bar chart"
                  conversation_id: "conv_123"
                  options:
                    include_visualization: true
                    max_results: 10
      responses:
        '200':
          description: Query processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      query_id:
                        type: string
                        example: "q_789"
                      spl_query:
                        type: string
                        example: "search earliest=-1h severity=high error"
                      results:
                        type: array
                        items:
                          type: object
                      result_count:
                        type: integer
                        example: 42
                      execution_time:
                        type: number
                        example: 1.25
                      visualization:
                        $ref: '#/components/schemas/Visualization'
                  metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # Visualization endpoints
  /api/v1/visualization/generate-chart:
    post:
      tags:
        - Visualization
      summary: Generate chart from data
      description: Create interactive charts from Splunk query results
      operationId: generateChart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - chart_type
              properties:
                data:
                  type: array
                  description: Data points for the chart
                  items:
                    type: object
                chart_type:
                  type: string
                  enum: [bar, line, pie, scatter, area, heatmap, treemap, radar]
                  example: bar
                title:
                  type: string
                  example: "Errors by Source"
                x_axis:
                  type: string
                  example: "source"
                y_axis:
                  type: string
                  example: "count"
                theme:
                  type: string
                  enum: [light, dark, corporate, minimal]
                  default: light
                interactive:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Chart generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Visualization'

  # Alert endpoints
  /api/v1/alerts:
    get:
      tags:
        - Alerts
      summary: List alerts
      description: Retrieve all alerts for the authenticated user
      operationId: listAlerts
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          description: Filter by alert status
          schema:
            type: string
            enum: [active, resolved, suppressed]
        - name: severity
          in: query
          description: Filter by alert severity
          schema:
            type: string
            enum: [low, medium, high, critical]
      responses:
        '200':
          description: Alerts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      alerts:
                        type: array
                        items:
                          $ref: '#/components/schemas/Alert'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

    post:
      tags:
        - Alerts
      summary: Create alert
      description: Create a new alert from natural language description
      operationId: createAlert
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
              properties:
                name:
                  type: string
                  example: "High CPU Usage Alert"
                description:
                  type: string
                  example: "Alert me when CPU usage exceeds 90% for more than 5 minutes"
                severity:
                  type: string
                  enum: [low, medium, high, critical]
                  default: medium
                notification_channels:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [email, slack, teams, webhook]
                      config:
                        type: object
      responses:
        '201':
          description: Alert created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Alert'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from the `/auth/login` endpoint.
        Include in Authorization header as: `Bearer <token>`

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    LimitParam:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  schemas:
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
              description: JWT access token
            refresh_token:
              type: string
              description: JWT refresh token
            token_type:
              type: string
              example: "Bearer"
            expires_in:
              type: integer
              description: Access token expiration time in seconds
              example: 3600
            user:
              $ref: '#/components/schemas/User'
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'

    User:
      type: object
      properties:
        id:
          type: string
          example: "user_123"
        username:
          type: string
          example: "john.doe"
        email:
          type: string
          format: email
          example: "john.doe@company.com"
        roles:
          type: array
          items:
            type: string
          example: ["user", "analyst"]
        created_at:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time

    Visualization:
      type: object
      properties:
        id:
          type: string
          example: "viz_456"
        type:
          type: string
          enum: [bar, line, pie, scatter, area, heatmap, treemap, radar]
        title:
          type: string
        config:
          type: object
          description: Chart configuration
        data:
          type: array
          items:
            type: object
        url:
          type: string
          description: URL to access the visualization
        embed_code:
          type: string
          description: HTML embed code

    Alert:
      type: object
      properties:
        id:
          type: string
          example: "alert_789"
        name:
          type: string
          example: "High CPU Usage"
        description:
          type: string
        query:
          type: string
          description: Generated SPL query
        status:
          type: string
          enum: [active, resolved, suppressed]
        severity:
          type: string
          enum: [low, medium, high, critical]
        created_at:
          type: string
          format: date-time
        last_triggered:
          type: string
          format: date-time
        trigger_count:
          type: integer
        notification_channels:
          type: array
          items:
            type: object

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 500
        pages:
          type: integer
          example: 25
        has_next:
          type: boolean
          example: true
        has_prev:
          type: boolean
          example: false

    ResponseMetadata:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2025-01-22T10:30:00Z"
        correlation_id:
          type: string
          example: "corr_12345"
        version:
          type: string
          example: "1.0"

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Invalid input parameters"
        field:
          type: string
          example: "query"
        details:
          type: object

  responses:
    BadRequest:
      description: Bad request - invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation_error:
              summary: Validation error
              value:
                success: false
                data: null
                metadata:
                  timestamp: "2025-01-22T10:30:00Z"
                  correlation_id: "corr_12345"
                  version: "1.0"
                errors:
                  - code: "VALIDATION_ERROR"
                    message: "Query parameter is required"
                    field: "query"

    Unauthorized:
      description: Unauthorized - invalid or missing authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_token:
              summary: Missing authentication token
              value:
                success: false
                data: null
                errors:
                  - code: "UNAUTHORIZED"
                    message: "Authentication token required"

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Request limit per hour
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Time when rate limit resets (Unix timestamp)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  examples:
    ExampleUser:
      summary: Example user object
      value:
        id: "user_123"
        username: "john.doe"
        email: "john.doe@company.com"
        roles: ["user", "analyst"]
        created_at: "2025-01-01T00:00:00Z"
        last_login: "2025-01-22T09:30:00Z"

tags:
  - name: Authentication
    description: User authentication and session management
  - name: System
    description: System health and monitoring endpoints
  - name: NLP Engine
    description: Natural language processing and query translation
  - name: Visualization
    description: Chart generation and dashboard management
  - name: Alerts
    description: Alert creation and management
  - name: Reports
    description: Report scheduling and delivery
  - name: Integrations
    description: External system integrations

externalDocs:
  description: Find more information about Splunk MCP Integration
  url: https://docs.splunk-mcp.com